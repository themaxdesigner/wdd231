<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Get in touch with Healthy Living Community.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="images/favicon.ico">
  <link rel="stylesheet" href="styles/main.css">

  <title>Contact Us | Healthy Living Community</title>
</head>
<body>
  <header>
    <div class="container">
      <h1>Healthy Living Community</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="recipes.html">Recipes</a>
        <a href="wellness.html">Wellness</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2>Contact Us</h2>
    <form id="contactForm" method="get" action="thanks.html">
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" name="fullname" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required>

      <label for="reason">Reason for Contact</label>
      <select id="reason" name="reason">
        <option value="feedback">Feedback</option>
        <option value="recipe">Submit a Recipe</option>
        <option value="wellness">Ask a Wellness Question</option>
      </select>

      <label for="message">Your Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit">Send Message</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 Healthy Living Community | All Rights Reserved</p>
  </footer>
</body>
</html>
